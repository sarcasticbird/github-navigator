<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub Navigator Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 16px;
      max-width: 480px;
      color: #c9d1d9;
      background: #0d1117;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #8b949e;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #c9d1d9;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button {
      margin-top: 12px;
      padding: 6px 16px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #30363d;
    }
    .status {
      margin-top: 8px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.success { color: #3fb950; }
    .status.error { color: #f85149; }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>GitHub Navigator Settings</h2>
  <label for="pat">Personal Access Token</label>
  <input type="text" id="pat" placeholder="ghp_..." autocomplete="off" spellcheck="false">
  <button id="save">Save</button>
  <div id="status" class="status"></div>
  <div class="hint">
    Create a token at <strong>GitHub &gt; Settings &gt; Developer settings &gt; Personal access tokens</strong>.<br>
    Required scopes: <code>read:org</code>, <code>repo</code>
  </div>
  <script src="options.js"></script>
</body>
</html>

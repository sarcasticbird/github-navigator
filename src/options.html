<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub Navigator Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 16px;
      max-width: 480px;
      color: #24292f;
      background: #f6f8fa;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #57606a;
    }
    input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      color: #24292f;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #0969da;
    }
    button {
      margin-top: 8px;
      padding: 4px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      color: #24292f;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #f3f4f6;
    }
    .status {
      margin-top: 8px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.success { color: #1a7f37; }
    .status.error { color: #cf222e; }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #57606a;
      line-height: 1.5;
    }
    .hint a {
      color: #0969da;
      text-decoration: none;
    }
    .hint a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>GitHub Navigator Settings</h2>
  <label for="pat">Personal Access Token (classic)</label>
  <input type="password" id="pat" placeholder="ghp_..." autocomplete="off" spellcheck="false">
  <button id="save">Save</button>
  <div id="status" class="status"></div>
  <div class="hint">
    <a href="https://github.com/settings/tokens/new?scopes=read:org,repo&amp;description=GitHub%20Navigator" target="_blank" rel="noopener noreferrer">Create a classic token with required scopes &rarr;</a><br>
    Or manage existing tokens at <a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer">github.com/settings/tokens</a>.<br>
    Fine-grained tokens do not support the org membership API.<br>
    Required scopes: <code>read:org</code>, <code>repo</code>
  </div>
  <script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="setup" class="view" hidden>
    <p>Set up your GitHub token to get started.</p>
    <button id="open-settings">Open Settings</button>
  </div>

  <div id="main" class="view" hidden>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search..." autocomplete="off" spellcheck="false">
      <button id="sort-toggle" title="Sort order">A-Z</button>
    </div>

    <div id="tree" class="tree"></div>

    <div class="footer">
      <span id="updated"></span>
      <button id="open-my-prs" title="My pull requests">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
        </svg>
      </button>
      <button id="open-notifications" title="Open GitHub notifications">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M2.8 2.06A1.75 1.75 0 0 1 4.41 1h7.18c.7 0 1.333.417 1.61 1.06l2.74 6.395c.04.092.06.19.06.295v4.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25v-4.5c0-.105.02-.203.06-.295Zm1.61.44a.25.25 0 0 0-.23.152L1.887 8H4.75a.75.75 0 0 1 .6.3L6.625 10h2.75l1.275-1.7a.75.75 0 0 1 .6-.3h2.863L11.82 2.652a.25.25 0 0 0-.23-.152Zm10.09 7h-2.875l-1.275 1.7a.75.75 0 0 1-.6.3h-3.5a.75.75 0 0 1-.6-.3L4.375 9.5H1.5v3.75c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25Z"/>
        </svg>
      </button>
      <button id="close-all-tabs" title="Close all GitHub tabs">&#x2715;</button>
      <button id="refresh" title="Refresh">&#x21bb;</button>
    </div>
  </div>

  <div id="error" class="view" hidden>
    <p id="error-message"></p>
    <button id="error-settings">Open Settings</button>
  </div>

  <div id="loading" class="view">
    <p>Loading...</p>
  </div>

  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" type="button">Cancel</button>
        <button id="modal-ok" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

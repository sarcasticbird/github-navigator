<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="setup" class="view" hidden>
    <p>Set up your GitHub token to get started.</p>
    <button id="open-settings">Open Settings</button>
  </div>

  <div id="main" class="view" hidden>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search..." autocomplete="off" spellcheck="false">
      <button id="sort-toggle" title="Sort order">A-Z</button>
    </div>

    <div id="tree" class="tree"></div>

    <div class="footer">
      <span id="updated"></span>
      <button id="open-notifications" title="Open GitHub notifications">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M8 16a2 2 0 0 0 1.985-1.75c.017-.137-.097-.25-.235-.25h-3.5c-.138 0-.252.113-.235.25A2 2 0 0 0 8 16ZM3 5a5 5 0 0 1 10 0v2.947c0 .05.015.098.042.139l1.703 2.555A1.519 1.519 0 0 1 13.482 13H2.518a1.516 1.516 0 0 1-1.263-2.36l1.703-2.554A.255.255 0 0 0 3 7.947Zm5-3.5A3.5 3.5 0 0 0 4.5 5v2.947c0 .346-.102.683-.294.97l-1.703 2.556a.017.017 0 0 0-.003.01l.001.006c0 .002.002.004.004.006l.006.004.007.001h10.964l.007-.001.006-.004.004-.006.001-.007a.017.017 0 0 0-.003-.01l-1.703-2.554a1.745 1.745 0 0 1-.294-.97V5A3.5 3.5 0 0 0 8 1.5Z"/>
        </svg>
      </button>
      <button id="close-all-tabs" title="Close all GitHub tabs">&#x2715;</button>
      <button id="refresh" title="Refresh">&#x21bb;</button>
    </div>
  </div>

  <div id="error" class="view" hidden>
    <p id="error-message"></p>
    <button id="error-settings">Open Settings</button>
  </div>

  <div id="loading" class="view">
    <p>Loading...</p>
  </div>

  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" type="button">Cancel</button>
        <button id="modal-ok" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
